name: Cache mode CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

cache-mode: write

jobs:
  seed:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - id: cache-restore
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .cache-fixture
          key: wromm-cache-mode-v1
      - name: Create cached value on a miss
        run: |
          mkdir -p .cache-fixture
          if [ ! -f .cache-fixture/value ]; then
            printf 'cache-mode-ok\n' > .cache-fixture/value
          fi
      - name: Save cache in write mode
        if: steps.cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .cache-fixture
          key: wromm-cache-mode-v1

  verify:
    needs: seed
    runs-on: ubuntu-24.04
    cache-mode: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - id: cache-restore
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .cache-fixture
          key: wromm-cache-mode-v1
      - name: Verify restored value
        run: test "$(cat .cache-fixture/value)" = cache-mode-ok
      - name: Save is skipped in read mode
        if: always() && steps.cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .cache-fixture
          key: wromm-cache-mode-v1
